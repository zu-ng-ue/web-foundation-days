<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>quicknotes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>quicknotes</h1>
        <p>capture ideas before they disappear.</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>add a note</h2>

            <form id="note-form">
                <label for="note-input">New notes</label>
                <input type="text" id="note-input" placeholder="what do you want to remember?" required>
                <button type="submit">Add Notes</button>
            </form>
        </section>
        <section>
            <h2>Your notes</h2>
            <p id="note-count">You have 2 notes.</p>

            <ul id="notes-list">
                <li>Revise HTML forms</li>
                <li>push my code to GitHub</li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 quicknotes. Built during Web Development Foundations.</p>
    </footer>
</body>

</html>
