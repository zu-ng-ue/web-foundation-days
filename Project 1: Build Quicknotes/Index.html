<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts instantly.</p>
    </header>

    <main>
        <!-- Section 1: Add a Note -->
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">Note text</label>
                <input type="text" id="note-input" placeholder="Type your note here..." maxlength="200" />
                
                <label for="note-category">Category</label>
                <select id="note-category">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <!-- Section 2: Your Notes -->
        <section>
            <h2>Your notes</h2>
            <input type="text" id="search-input" placeholder="Search notes..." />
            <p id="note-count">You have no notes yet.</p>
            
            <ul id="notes-list"></ul>
            
            <button id="clear-all-btn">Clear all</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built during Web I.</p>
    </footer>
</body>
</html>
