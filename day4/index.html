<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" ,initial-scale=1.0 />
    <title>quicknotes - day4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>quicknotes</h1>
        <button id="theme-toggle">Dark mode</button>
    </header>
    <main>
        <section>
            <label for="note-text">your Note</label>
            <textarea id="note-text" placeholder="type your note here..."></textarea>

            <div class="counters">
                <p id="char-count">0/200 characters</p>
                <p id="word-count">0 words</p>
            </div>
            <button id="clear-bin">Clear</button>
        </section>
    </main>
</body>

</html>
